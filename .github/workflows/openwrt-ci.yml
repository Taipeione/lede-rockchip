#
# EmbedFire DoorNet2 OpenWrt + iStore
#
# Features:
# - LAN IP: 192.168.100.1
# - WAN: eth0 DHCP
# - 7GB ext4 rootfs
# - TF/SD priority boot
# - No TF -> fallback to eMMC
# - iStore
# - Self-hosted OPKG feed
# - GitHub Releases
# - LuCI online firmware updater
# - SHA256 verification
# - sysupgrade compatibility test
# - Disk management utilities
# - taskd compatibility fix
#
# Base source:
# https://github.com/DHDAXCW/lede-rockchip
#

name: DoorNet2-OpenWrt-iStore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:

    name: Build DoorNet2 OpenWrt Firmware

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Prepare GitHub runner
      # ============================================================

      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "========================================"
          echo "Clean runner disk space"
          echo "========================================"

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true

          docker system prune -af 2>/dev/null || true

          echo "========================================"
          echo "APT update"
          echo "========================================"

          sudo apt-get update

          echo "========================================"
          echo "Install OpenWrt build dependencies"
          echo "========================================"

          sudo apt-get install -y --no-install-recommends \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

          sudo apt-get clean

          sudo timedatectl set-timezone "Asia/Shanghai" || true

          echo "========================================"
          echo "Disk space"
          echo "========================================"

          df -h


      # ============================================================
      # 2. Checkout source
      # ============================================================

      - name: Checkout OpenWrt
        uses: actions/checkout@v4


      # ============================================================
      # 3. Build version
      # ============================================================

      - name: Generate build version
        run: |
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_DAY="$(date -u +'%Y.%m.%d')"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          VERSION="${BUILD_DAY}-r${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          TAG="doornet2-${VERSION}"

          echo "DOORNET2_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DOORNET2_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "DOORNET2_BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"

          echo "========================================"
          echo "DoorNet2 version"
          echo "========================================"
          echo "Version: ${VERSION}"
          echo "Tag:     ${TAG}"
          echo "Date:    ${BUILD_DATE}"


      # ============================================================
      # 4. iStore
      # ============================================================

      - name: Add iStore feed
        run: |
          echo "========================================"
          echo "Add iStore feed"
          echo "========================================"

          grep -q '^src-git istore ' feeds.conf.default || \
            echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default

          cat feeds.conf.default


      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

          ./scripts/feeds install -d y -p istore luci-app-store


      # ============================================================
      # 5. LAN
      # ============================================================

      - name: Set default LAN IP
        run: |
          LAN_CONFIG="package/base-files/files/bin/config_generate"

          echo "========================================"
          echo "Set LAN IP: 192.168.100.1"
          echo "========================================"

          if [ ! -f "$LAN_CONFIG" ]; then
            echo "ERROR: Cannot find $LAN_CONFIG"
            exit 1
          fi

          if ! grep -q "192\.168\.1\.1" "$LAN_CONFIG"; then
            echo "ERROR: Default LAN IP 192.168.1.1 not found"
            exit 1
          fi

          sed -i \
            's/192\.168\.1\.1/192.168.100.1/g' \
            "$LAN_CONFIG"

          if ! grep -q "192\.168\.100\.1" "$LAN_CONFIG"; then
            echo "ERROR: LAN IP modification failed"
            exit 1
          fi

          grep -n "192\.168\.100\.1" "$LAN_CONFIG"


      # ============================================================
      # 6. WAN
      # ============================================================

      - name: Configure default WAN
        run: |
          echo "========================================"
          echo "WAN = eth0 DHCP"
          echo "========================================"

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/96-doornet2-wan <<'EOF'
          #!/bin/sh

          uci -q set network.wan='interface'
          uci -q set network.wan.device='eth0'
          uci -q set network.wan.proto='dhcp'

          uci -q commit network

          logger -t doornet2 \
            "Default WAN configured: eth0 DHCP"

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/96-doornet2-wan


      # ============================================================
      # 7. OPKG GitHub feed
      # ============================================================

      - name: Configure GitHub OPKG feed
        run: |
          echo "========================================"
          echo "Configure GitHub OPKG feed"
          echo "========================================"

          mkdir -p files/etc/opkg

          cat > files/etc/opkg/distfeeds.conf <<'EOF'
          src/gz openwrt_core https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/targets/rockchip/armv8/packages
          src/gz openwrt_base https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/base
          src/gz openwrt_istore https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/istore
          src/gz openwrt_luci https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/luci
          src/gz openwrt_packages https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/packages
          src/gz openwrt_routing https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/routing
          src/gz openwrt_telephony https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/telephony
          EOF

          cat files/etc/opkg/distfeeds.conf


      # ============================================================
      # 8. Embed release information
      # ============================================================

      - name: Embed DoorNet2 version
        run: |
          echo "========================================"
          echo "Embed DoorNet2 version"
          echo "========================================"

          mkdir -p files/etc

          cat > files/etc/doornet2_release <<EOF
          DOORNET2_VERSION='${DOORNET2_VERSION}'
          DOORNET2_TAG='${DOORNET2_TAG}'
          DOORNET2_BUILD_DATE='${DOORNET2_BUILD_DATE}'
          DOORNET2_GIT_COMMIT='${GITHUB_SHA}'
          DOORNET2_GITHUB_REPOSITORY='${GITHUB_REPOSITORY}'
          DOORNET2_BOARD='embedfire,doornet2'
          EOF

          cat files/etc/doornet2_release


      # ============================================================
      # 9. DoorNet2 online updater backend + LuCI
      # ============================================================

      - name: Add DoorNet2 online updater
        run: |
          echo "========================================"
          echo "Add DoorNet2 LuCI Online Updater"
          echo "========================================"

          mkdir -p files/usr/bin
          mkdir -p files/usr/lib/lua/luci/controller
          mkdir -p files/usr/lib/lua/luci/view/doornet2


          # --------------------------------------------------------
          # Backend updater
          # --------------------------------------------------------

          cat > files/usr/bin/doornet2-updater <<'EOF'
          #!/bin/sh

          REPO="Taipeione/lede-rockchip"

          BASE_URL="https://github.com/${REPO}/releases/latest/download"

          WORKDIR="/tmp/doornet2-update"

          META="${WORKDIR}/version.json"

          FIRMWARE="${WORKDIR}/DoorNet2-ext4-sysupgrade.img.gz"

          TESTLOG="/tmp/doornet2-sysupgrade-test.log"

          UPGRADELOG="/tmp/doornet2-upgrade.log"

          RELEASE_INFO="/etc/doornet2_release"

          EXPECTED_BOARD="embedfire,doornet2"

          EXPECTED_ASSET="DoorNet2-ext4-sysupgrade.img.gz"


          get_current_version()
          {
              CURRENT_VERSION="unknown"
              CURRENT_TAG="unknown"

              if [ -f "$RELEASE_INFO" ]; then

                  . "$RELEASE_INFO"

                  CURRENT_VERSION="${DOORNET2_VERSION:-unknown}"
                  CURRENT_TAG="${DOORNET2_TAG:-unknown}"

              fi
          }


          get_root_info()
          {
              ROOT_DEVICE="$(
                  sed -n \
                    's/.* root=\([^ ]*\).*/\1/p' \
                    /proc/cmdline
              )"

              case "$ROOT_DEVICE" in

                  /dev/mmcblk0p2)

                      UPGRADE_DISK="/dev/mmcblk0"
                      BOOT_MEDIA="eMMC"

                      ;;

                  /dev/mmcblk1p2)

                      UPGRADE_DISK="/dev/mmcblk1"
                      BOOT_MEDIA="TF"

                      ;;

                  *)

                      UPGRADE_DISK="unknown"
                      BOOT_MEDIA="unknown"

                      ;;

              esac
          }


          get_board()
          {
              BOARD="$(
                  cat /tmp/sysinfo/board_name 2>/dev/null
              )"

              [ -n "$BOARD" ] || BOARD="unknown"
          }


          fetch_metadata()
          {
              mkdir -p "$WORKDIR"

              rm -f "${META}.part"

              if ! curl \
                  -LfsS \
                  --connect-timeout 15 \
                  --retry 3 \
                  -o "${META}.part" \
                  "${BASE_URL}/version.json"
              then

                  return 1

              fi

              mv "${META}.part" "$META"

              LATEST_VERSION="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.version' \
                    2>/dev/null
              )"

              LATEST_TAG="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.tag' \
                    2>/dev/null
              )"

              LATEST_BOARD="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.board' \
                    2>/dev/null
              )"

              LATEST_ASSET="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.asset' \
                    2>/dev/null
              )"

              LATEST_SHA="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.sha256' \
                    2>/dev/null
              )"

              [ "$LATEST_BOARD" = "$EXPECTED_BOARD" ] || return 2

              [ "$LATEST_ASSET" = "$EXPECTED_ASSET" ] || return 3

              [ -n "$LATEST_VERSION" ] || return 4

              echo "$LATEST_SHA" | \
                grep -Eq '^[0-9a-fA-F]{64}$' || return 5

              return 0
          }


          command_status()
          {
              get_current_version

              get_root_info

              get_board

              printf '{'

              printf '"ok":true,'

              printf '"current_version":"%s",' \
                "$CURRENT_VERSION"

              printf '"current_tag":"%s",' \
                "$CURRENT_TAG"

              printf '"board":"%s",' \
                "$BOARD"

              printf '"root_device":"%s",' \
                "$ROOT_DEVICE"

              printf '"upgrade_disk":"%s",' \
                "$UPGRADE_DISK"

              printf '"boot_media":"%s"' \
                "$BOOT_MEDIA"

              printf '}\n'
          }


          command_check()
          {
              get_current_version

              get_root_info

              get_board

              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1

              fi


              if ! fetch_metadata; then

                  printf \
                    '{"ok":false,"message":"metadata_download_failed"}\n'

                  exit 1

              fi


              if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then

                  AVAILABLE="false"

              else

                  AVAILABLE="true"

              fi


              printf '{'

              printf '"ok":true,'

              printf '"current_version":"%s",' \
                "$CURRENT_VERSION"

              printf '"latest_version":"%s",' \
                "$LATEST_VERSION"

              printf '"latest_tag":"%s",' \
                "$LATEST_TAG"

              printf '"update_available":%s,' \
                "$AVAILABLE"

              printf '"boot_media":"%s",' \
                "$BOOT_MEDIA"

              printf '"upgrade_disk":"%s"' \
                "$UPGRADE_DISK"

              printf '}\n'
          }


          command_prepare()
          {
              get_current_version

              get_root_info

              get_board


              case "$ROOT_DEVICE" in

                  /dev/mmcblk0p2|/dev/mmcblk1p2)

                      ;;

                  *)

                      printf \
                        '{"ok":false,"message":"unsupported_root_device"}\n'

                      exit 1

                      ;;

              esac


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1

              fi


              if ! fetch_metadata; then

                  printf \
                    '{"ok":false,"message":"metadata_download_failed"}\n'

                  exit 1

              fi


              rm -f "${FIRMWARE}.part"


              if ! curl \
                  -LfsS \
                  --connect-timeout 15 \
                  --retry 3 \
                  -o "${FIRMWARE}.part" \
                  "${BASE_URL}/${EXPECTED_ASSET}"
              then

                  rm -f "${FIRMWARE}.part"

                  printf \
                    '{"ok":false,"message":"firmware_download_failed"}\n'

                  exit 1

              fi


              mv "${FIRMWARE}.part" "$FIRMWARE"


              ACTUAL_SHA="$(
                  sha256sum "$FIRMWARE" | \
                    awk '{print $1}'
              )"


              if [ "$ACTUAL_SHA" != "$LATEST_SHA" ]; then

                  rm -f "$FIRMWARE"

                  printf \
                    '{"ok":false,"message":"sha256_failed"}\n'

                  exit 1

              fi


              rm -f "$TESTLOG"


              if ! /sbin/sysupgrade \
                  -T \
                  "$FIRMWARE" \
                  >"$TESTLOG" 2>&1
              then

                  printf \
                    '{"ok":false,"message":"sysupgrade_test_failed"}\n'

                  exit 1

              fi


              SIZE="$(
                  du -h "$FIRMWARE" | \
                    awk '{print $1}'
              )"


              printf '{'

              printf '"ok":true,'

              printf '"ready":true,'

              printf '"current_version":"%s",' \
                "$CURRENT_VERSION"

              printf '"latest_version":"%s",' \
                "$LATEST_VERSION"

              printf '"sha256":"%s",' \
                "$ACTUAL_SHA"

              printf '"size":"%s",' \
                "$SIZE"

              printf '"boot_media":"%s",' \
                "$BOOT_MEDIA"

              printf '"upgrade_disk":"%s"' \
                "$UPGRADE_DISK"

              printf '}\n'
          }


          command_upgrade()
          {
              get_root_info

              get_board


              case "$ROOT_DEVICE" in

                  /dev/mmcblk0p2|/dev/mmcblk1p2)

                      ;;

                  *)

                      printf \
                        '{"ok":false,"message":"unsupported_root_device"}\n'

                      exit 1

                      ;;

              esac


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1

              fi


              if [ ! -f "$META" ] || \
                 [ ! -f "$FIRMWARE" ]; then

                  printf \
                    '{"ok":false,"message":"firmware_not_prepared"}\n'

                  exit 1

              fi


              LATEST_SHA="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.sha256' \
                    2>/dev/null
              )"


              ACTUAL_SHA="$(
                  sha256sum "$FIRMWARE" | \
                    awk '{print $1}'
              )"


              if [ -z "$LATEST_SHA" ] || \
                 [ "$LATEST_SHA" != "$ACTUAL_SHA" ]; then

                  printf \
                    '{"ok":false,"message":"sha256_failed"}\n'

                  exit 1

              fi


              if ! /sbin/sysupgrade \
                  -T \
                  "$FIRMWARE" \
                  >"$TESTLOG" 2>&1
              then

                  printf \
                    '{"ok":false,"message":"sysupgrade_test_failed"}\n'

                  exit 1

              fi


              sync


              (
                  sleep 3

                  /sbin/sysupgrade \
                    -v \
                    "$FIRMWARE"

              ) >"$UPGRADELOG" 2>&1 </dev/null &


              printf '{'

              printf '"ok":true,'

              printf '"started":true,'

              printf '"boot_media":"%s",' \
                "$BOOT_MEDIA"

              printf '"upgrade_disk":"%s"' \
                "$UPGRADE_DISK"

              printf '}\n'
          }


          case "$1" in

              status)

                  command_status

                  ;;

              check)

                  command_check

                  ;;

              prepare)

                  command_prepare

                  ;;

              upgrade)

                  command_upgrade

                  ;;

              *)

                  echo "Usage:"
                  echo "  doornet2-updater status"
                  echo "  doornet2-updater check"
                  echo "  doornet2-updater prepare"
                  echo "  doornet2-updater upgrade"

                  exit 1

                  ;;

          esac
          EOF

          chmod 755 files/usr/bin/doornet2-updater


          # --------------------------------------------------------
          # LuCI controller
          # --------------------------------------------------------

          cat > \
            files/usr/lib/lua/luci/controller/doornet2_update.lua \
            <<'EOF'
          module("luci.controller.doornet2_update", package.seeall)

          function index()

              if not nixio.fs.access(
                  "/usr/bin/doornet2-updater"
              ) then
                  return
              end


              local page


              page = entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update"
                  },

                  template(
                      "doornet2/update"
                  ),

                  _("DoorNet2 在线升级"),

                  90
              )


              page.dependent = false


              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "status"
                  },

                  call("action_status")

              ).leaf = true


              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "check"
                  },

                  call("action_check")

              ).leaf = true


              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "prepare"
                  },

                  call("action_prepare")

              ).leaf = true


              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "upgrade"
                  },

                  call("action_upgrade")

              ).leaf = true
          end


          local function output_json(command)

              local http = require "luci.http"
              local sys  = require "luci.sys"

              local result = sys.exec(
                  "/usr/bin/doornet2-updater " ..
                  command ..
                  " 2>/dev/null"
              )

              http.prepare_content(
                  "application/json"
              )

              http.write(result)
          end


          local function require_post()

              local http = require "luci.http"

              if http.getenv(
                  "REQUEST_METHOD"
              ) ~= "POST" then

                  http.status(
                      405,
                      "Method Not Allowed"
                  )

                  http.prepare_content(
                      "application/json"
                  )

                  http.write(
                      '{"ok":false,"message":"POST required"}'
                  )

                  return false
              end

              return true
          end


          function action_status()

              output_json("status")

          end


          function action_check()

              output_json("check")

          end


          function action_prepare()

              if not require_post() then
                  return
              end

              output_json("prepare")

          end


          function action_upgrade()

              if not require_post() then
                  return
              end

              output_json("upgrade")

          end
          EOF


          # --------------------------------------------------------
          # LuCI view
          # --------------------------------------------------------

          cat > \
            files/usr/lib/lua/luci/view/doornet2/update.htm \
            <<'EOF'
          <%+header%>

          <h2>
              <%:DoorNet2 在线升级%>
          </h2>


          <div class="cbi-map">


              <div class="cbi-section">

                  <h3>
                      <%:固件信息%>
                  </h3>


                  <table class="table">

                      <tr class="tr">

                          <td class="td">
                              <strong>当前版本</strong>
                          </td>

                          <td
                              class="td"
                              id="current_version"
                          >
                              正在读取...
                          </td>

                      </tr>


                      <tr class="tr">

                          <td class="td">
                              <strong>最新版本</strong>
                          </td>

                          <td
                              class="td"
                              id="latest_version"
                          >
                              尚未检查
                          </td>

                      </tr>


                      <tr class="tr">

                          <td class="td">
                              <strong>当前启动介质</strong>
                          </td>

                          <td
                              class="td"
                              id="boot_media"
                          >
                              -
                          </td>

                      </tr>


                      <tr class="tr">

                          <td class="td">
                              <strong>升级目标磁盘</strong>
                          </td>

                          <td
                              class="td"
                              id="upgrade_disk"
                          >
                              -
                          </td>

                      </tr>

                  </table>

              </div>


              <div class="cbi-section">

                  <h3>
                      <%:在线升级%>
                  </h3>


                  <p>
                      系统会依次执行：
                      检查 GitHub 最新版本 →
                      下载固件 →
                      SHA256 校验 →
                      sysupgrade 兼容性检查 →
                      正式升级。
                  </p>


                  <p>
                      TF 启动时只升级 TF；
                      eMMC 启动时只升级 eMMC。
                  </p>


                  <div style="margin-top:20px">


                      <input
                          type="button"
                          class="btn cbi-button cbi-button-action"
                          id="btn_check"
                          value="检查更新"
                          onclick="checkUpdate()"
                      />


                      &nbsp;


                      <input
                          type="button"
                          class="btn cbi-button cbi-button-apply"
                          id="btn_prepare"
                          value="下载并校验"
                          onclick="prepareUpdate()"
                          disabled="disabled"
                      />


                      &nbsp;


                      <input
                          type="button"
                          class="btn cbi-button cbi-button-negative"
                          id="btn_upgrade"
                          value="立即升级"
                          onclick="startUpgrade()"
                          disabled="disabled"
                      />


                  </div>


                  <div
                      id="status_box"
                      style="
                          margin-top:20px;
                          padding:15px;
                          border:1px solid #ccc;
                          border-radius:4px;
                          min-height:24px;
                      "
                  >
                      正在读取设备信息...
                  </div>

              </div>


          </div>


          <script type="text/javascript">


          var URL_STATUS =
              '<%=luci.dispatcher.build_url(
                  "admin",
                  "system",
                  "doornet2_update",
                  "status"
              )%>';


          var URL_CHECK =
              '<%=luci.dispatcher.build_url(
                  "admin",
                  "system",
                  "doornet2_update",
                  "check"
              )%>';


          var URL_PREPARE =
              '<%=luci.dispatcher.build_url(
                  "admin",
                  "system",
                  "doornet2_update",
                  "prepare"
              )%>';


          var URL_UPGRADE =
              '<%=luci.dispatcher.build_url(
                  "admin",
                  "system",
                  "doornet2_update",
                  "upgrade"
              )%>';


          function setStatus(text)
          {
              document.getElementById(
                  "status_box"
              ).innerHTML = text;
          }


          function setBusy(busy)
          {
              document.getElementById(
                  "btn_check"
              ).disabled = busy;


              if (busy)
              {
                  document.getElementById(
                      "btn_prepare"
                  ).disabled = true;


                  document.getElementById(
                      "btn_upgrade"
                  ).disabled = true;
              }
          }


          function request(
              url,
              method,
              callback
          )
          {
              var xhr =
                  new XMLHttpRequest();


              xhr.open(
                  method,
                  url,
                  true
              );


              if (method == "POST")
              {
                  xhr.setRequestHeader(
                      "Content-Type",
                      "application/x-www-form-urlencoded"
                  );
              }


              xhr.onreadystatechange =
                  function()
                  {
                      if (
                          xhr.readyState != 4
                      )
                      {
                          return;
                      }


                      var data = null;


                      try
                      {
                          data = JSON.parse(
                              xhr.responseText
                          );
                      }
                      catch (e)
                      {
                          callback(
                              {
                                  ok: false,
                                  message:
                                      "返回数据解析失败"
                              }
                          );

                          return;
                      }


                      callback(data);
                  };


              xhr.send(
                  method == "POST"
                      ? "confirm=1"
                      : null
              );
          }


          function loadStatus()
          {
              request(
                  URL_STATUS,
                  "GET",

                  function(data)
                  {
                      if (!data.ok)
                      {
                          setStatus(
                              "无法读取设备状态。"
                          );

                          return;
                      }


                      document.getElementById(
                          "current_version"
                      ).innerHTML =
                          data.current_version;


                      document.getElementById(
                          "boot_media"
                      ).innerHTML =
                          data.boot_media;


                      document.getElementById(
                          "upgrade_disk"
                      ).innerHTML =
                          data.upgrade_disk;


                      setStatus(
                          "设备状态正常。"
                      );
                  }
              );
          }


          function checkUpdate()
          {
              setBusy(true);


              setStatus(
                  "正在连接 GitHub 检查最新版本..."
              );


              request(
                  URL_CHECK,
                  "GET",

                  function(data)
                  {
                      setBusy(false);


                      if (!data.ok)
                      {
                          setStatus(
                              "检查更新失败：" +
                              (
                                  data.message ||
                                  "未知错误"
                              )
                          );

                          return;
                      }


                      document.getElementById(
                          "current_version"
                      ).innerHTML =
                          data.current_version;


                      document.getElementById(
                          "latest_version"
                      ).innerHTML =
                          data.latest_version;


                      document.getElementById(
                          "boot_media"
                      ).innerHTML =
                          data.boot_media;


                      document.getElementById(
                          "upgrade_disk"
                      ).innerHTML =
                          data.upgrade_disk;


                      if (
                          data.update_available
                      )
                      {
                          setStatus(
                              "<strong>发现新版本。</strong>" +
                              "<br />" +
                              "可以点击“下载并校验”。"
                          );


                          document.getElementById(
                              "btn_prepare"
                          ).disabled = false;
                      }
                      else
                      {
                          setStatus(
                              "<strong>当前已经是最新版本。</strong>"
                          );
                      }
                  }
              );
          }


          function prepareUpdate()
          {
              if (
                  !confirm(
                      "现在开始下载最新版固件并进行 SHA256 和兼容性校验？"
                  )
              )
              {
                  return;
              }


              setBusy(true);


              setStatus(
                  "正在下载固件并校验，请不要关闭页面。"
                  + "<br />"
                  + "通常需要几十秒。"
              );


              request(
                  URL_PREPARE,
                  "POST",

                  function(data)
                  {
                      setBusy(false);


                      if (!data.ok)
                      {
                          setStatus(
                              "<strong>准备升级失败：</strong> " +
                              (
                                  data.message ||
                                  "未知错误"
                              )
                          );

                          return;
                      }


                      document.getElementById(
                          "latest_version"
                      ).innerHTML =
                          data.latest_version;


                      document.getElementById(
                          "boot_media"
                      ).innerHTML =
                          data.boot_media;


                      document.getElementById(
                          "upgrade_disk"
                      ).innerHTML =
                          data.upgrade_disk;


                      setStatus(
                          "<strong>固件准备完成。</strong>"
                          + "<br />"
                          + "SHA256：验证通过"
                          + "<br />"
                          + "sysupgrade：兼容性检查通过"
                          + "<br />"
                          + "固件大小：" +
                          data.size
                          + "<br />"
                          + "升级目标：" +
                          data.upgrade_disk
                      );


                      document.getElementById(
                          "btn_upgrade"
                      ).disabled = false;
                  }
              );
          }


          function startUpgrade()
          {
              var disk =
                  document.getElementById(
                      "upgrade_disk"
                  ).innerHTML;


              if (
                  !confirm(
                      "即将正式升级 " +
                      disk +
                      "。\n\n" +
                      "升级期间绝对不要断电，也不要拔出 TF/eMMC。\n\n" +
                      "确定继续？"
                  )
              )
              {
                  return;
              }


              setBusy(true);


              setStatus(
                  "<strong>正在启动固件升级。</strong>"
                  + "<br />"
                  + "设备将在几秒后断开连接并自动重启。"
                  + "<br /><br />"
                  + "升级期间请勿断电。"
              );


              request(
                  URL_UPGRADE,
                  "POST",

                  function(data)
                  {
                      if (!data.ok)
                      {
                          setBusy(false);


                          setStatus(
                              "<strong>启动升级失败：</strong> " +
                              (
                                  data.message ||
                                  "未知错误"
                              )
                          );

                          return;
                      }


                      setStatus(
                          "<strong>升级已经开始。</strong>"
                          + "<br />"
                          + "目标磁盘：" +
                          data.upgrade_disk
                          + "<br />"
                          + "当前启动介质：" +
                          data.boot_media
                          + "<br /><br />"
                          + "请等待约 3～5 分钟，"
                          + "设备会自动重新启动。"
                      );
                  }
              );
          }


          window.onload = loadStatus;


          </script>

          <%+footer%>
          EOF


      # ============================================================
      # 10. TF / eMMC smart boot
      # ============================================================

      - name: Configure TF card priority boot
        run: |
          echo "========================================"
          echo "DoorNet2 smart boot"
          echo "TF inserted -> TF"
          echo "TF removed  -> eMMC"
          echo "========================================"

          cat > target/linux/rockchip/image/doornet2.bootscript <<'EOF'
          #
          # EmbedFire DoorNet2 TF/eMMC smart boot
          #

          if test "${devtype}" = "mmc"; then

              if test "${devnum}" = "1"; then

                  echo "DoorNet2: boot completely from TF card";

                  setenv rootdev "/dev/mmcblk1p2";


              elif test "${devnum}" = "0"; then

                  echo "DoorNet2: boot completely from eMMC";

                  setenv rootdev "/dev/mmcblk0p2";


              else

                  part uuid ${devtype} ${devnum}:2 uuid;

                  setenv rootdev "PARTUUID=${uuid}";

              fi;


          else

              part uuid ${devtype} ${devnum}:2 uuid;

              setenv rootdev "PARTUUID=${uuid}";

          fi;


          if test "${stdout}" = "serial@fe660000"; then

              setenv serial_addr ",0xfe660000";

          elif test "${stdout}" = "serial@feb50000"; then

              setenv serial_addr ",0xfeb50000";

          elif test "${stdout}" = "serial@ff130000"; then

              setenv serial_addr ",0xff130000";

          elif test "${stdout}" = "serial@ff1a0000"; then

              setenv serial_addr ",0xff1a0000";

          fi;


          setenv bootargs "coherent_pool=2M console=ttyS2,1500000 earlycon=uart8250,mmio32${serial_addr} root=${rootdev} rw rootwait";


          load ${devtype} ${devnum}:1 \
              ${kernel_addr_r} kernel.img;


          bootm ${kernel_addr_r};
          EOF


          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "target/linux/rockchip/image/armv8.mk"
          )

          text = path.read_text()

          start_marker = (
              "define Device/embedfire_doornet2"
          )

          start = text.find(start_marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: DoorNet2 device definition not found"
              )

          end = text.find(
              "endef",
              start
          )

          if end == -1:
              raise SystemExit(
                  "ERROR: DoorNet2 device definition incomplete"
              )

          block = text[start:end]

          if "BOOT_SCRIPT := doornet2" not in block:

              if (
                  "  BOOT_FLOW := pine64-bin\n"
                  not in block
              ):
                  raise SystemExit(
                      "ERROR: DoorNet2 BOOT_FLOW not found"
                  )

              block = block.replace(
                  "  BOOT_FLOW := pine64-bin\n",

                  "  BOOT_FLOW := pine64-bin\n"
                  "  BOOT_SCRIPT := doornet2\n"
              )

              text = (
                  text[:start] +
                  block +
                  text[end:]
              )

              path.write_text(text)


          new_text = path.read_text()

          start = new_text.find(
              start_marker
          )

          end = new_text.find(
              "endef",
              start
          )

          print(
              new_text[
                  start:
                  end + len("endef")
              ]
          )
          PY


          if ! grep -A8 \
            "define Device/embedfire_doornet2" \
            target/linux/rockchip/image/armv8.mk | \
            grep -q "BOOT_SCRIPT := doornet2"
          then

            echo "ERROR: BOOT_SCRIPT not enabled"

            exit 1

          fi


      # ============================================================
      # 11. taskd fix
      # ============================================================

      - name: Add taskd compatibility fix
        run: |
          echo "========================================"
          echo "Add taskd compatibility fix"
          echo "========================================"

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-taskd-compat <<'EOF'
          #!/bin/sh

          TASKS="/etc/init.d/tasks"

          if [ -f "$TASKS" ] && \
             grep -q 'extra_command ' "$TASKS" && \
             ! grep -q 'TASKD_EXTRA_COMMAND_COMPAT' "$TASKS"
          then

              TMP="/tmp/tasks.compat.$$"

              awk '
              NR == 1 {
                  print
                  print ""
                  print "# TASKD_EXTRA_COMMAND_COMPAT"
                  print "type extra_command >/dev/null 2>&1 || extra_command() { :; }"
                  next
              }

              {
                  print
              }
              ' "$TASKS" > "$TMP"

              cat "$TMP" > "$TASKS"

              rm -f "$TMP"

              chmod 755 "$TASKS"

              logger -t taskd \
                "Applied extra_command compatibility fix"

          fi

          exit 0
          EOF

          chmod 755 \
            files/etc/uci-defaults/99-taskd-compat


      # ============================================================
      # 12. OpenWrt config
      # ============================================================

      - name: Configure DoorNet2 and packages
        run: |
          cat >> .config <<'EOF'

          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y

          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_embedfire_doornet2=y

          #
          # Partition size
          #
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=7168

          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          #
          # iStore
          #
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-compat=y

          #
          # Online updater
          #
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_jsonfilter=y

          #
          # Disk tools
          #
          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_sfdisk=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_blockdev=y
          CONFIG_PACKAGE_partx-utils=y
          CONFIG_PACKAGE_mount-utils=y

          #
          # Ext4 tools
          #
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_tune2fs=y

          #
          # OpenWrt storage
          #
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y

          EOF


      # ============================================================
      # 13. Generate config
      # ============================================================

      - name: Generate configuration file
        run: |
          make defconfig

          echo "========================================"
          echo "DoorNet2 target"
          echo "========================================"

          grep -E \
            'CONFIG_TARGET.*embedfire_doornet2' \
            .config || true


          echo "========================================"
          echo "RootFS"
          echo "========================================"

          grep \
            'CONFIG_TARGET_ROOTFS_PARTSIZE' \
            .config || true


          echo "========================================"
          echo "Online updater"
          echo "========================================"

          grep -E \
            'CONFIG_PACKAGE_(curl|ca-bundle|ca-certificates|jsonfilter)' \
            .config || true


          echo "========================================"
          echo "Online updater files"
          echo "========================================"

          ls -lah \
            files/usr/bin/doornet2-updater \
            files/usr/lib/lua/luci/controller/doornet2_update.lua \
            files/usr/lib/lua/luci/view/doornet2/update.htm


      # ============================================================
      # 14. Download packages
      # ============================================================

      - name: Download packages
        run: |
          make download -j16

          find dl \
            -size -1024c \
            -exec rm -f {} \;


      # ============================================================
      # 15. Compile
      # ============================================================

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s

          echo "========================================"
          echo "Disk space"
          echo "========================================"

          df -h

          echo "========================================"
          echo "Firmware files"
          echo "========================================"

          find ./bin/targets/ \
            -type f \
            | sort


      # ============================================================
      # 16. Prepare normal artifacts + release
      # ============================================================

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          mkdir -p ./artifact/firmware
          mkdir -p ./artifact/release


          find ./bin/packages/ \
            -type f \
            -name "*.ipk" \
            -exec cp -f {} ./artifact/package/ \;


          find ./bin/targets/ \
            -type f \
            \( \
              -name "*.buildinfo" \
              -o -name "*.manifest" \
              -o -name "*.config" \
            \) \
            -exec cp -f {} ./artifact/buildinfo/ \;


          find ./bin/targets/ \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.bin" \
              -o -name "*.itb" \
              -o -name "*.gz" \
            \) \
            ! -path "*/packages/*" \
            -exec cp -f {} ./artifact/firmware/ \;


          SOURCE_FW="$(
            find ./bin/targets/rockchip/armv8 \
              -maxdepth 1 \
              -type f \
              -name '*embedfire_doornet2-ext4-sysupgrade.img.gz' \
              | head -n 1
          )"


          if [ -z "$SOURCE_FW" ]; then

            echo "ERROR: DoorNet2 firmware not found"

            exit 1

          fi


          echo "Firmware source:"

          echo "$SOURCE_FW"


          cp -f \
            "$SOURCE_FW" \
            ./artifact/release/DoorNet2-ext4-sysupgrade.img.gz


          cd ./artifact/release


          SHA256="$(
            sha256sum \
              DoorNet2-ext4-sysupgrade.img.gz \
              | awk '{print $1}'
          )"


          echo "${SHA256}  DoorNet2-ext4-sysupgrade.img.gz" \
            > sha256sums.txt


          cat > version.json <<EOF
          {
            "board": "embedfire,doornet2",
            "version": "${DOORNET2_VERSION}",
            "tag": "${DOORNET2_TAG}",
            "build_date": "${DOORNET2_BUILD_DATE}",
            "commit": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "asset": "DoorNet2-ext4-sysupgrade.img.gz",
            "sha256": "${SHA256}"
          }
          EOF


          cat > release-notes.md <<EOF
          # DoorNet2 OpenWrt ${DOORNET2_VERSION}

          Build information:

          - Board: EmbedFire DoorNet2
          - Target: rockchip/armv8
          - Version: ${DOORNET2_VERSION}
          - Git commit: ${GITHUB_SHA}
          - GitHub Actions run: ${GITHUB_RUN_NUMBER}
          - Build date: ${DOORNET2_BUILD_DATE}

          Main configuration:

          - LAN: 192.168.100.1
          - WAN: eth0 DHCP
          - RootFS: 7GB ext4
          - TF inserted: boot completely from TF
          - TF removed: boot from eMMC
          - iStore included
          - Self-hosted matching OPKG feed
          - LuCI online firmware updater

          Firmware:

          DoorNet2-ext4-sysupgrade.img.gz

          SHA256:

          ${SHA256}
          EOF


          echo "========================================"
          echo "Release files"
          echo "========================================"

          ls -lah

          cat version.json


      # ============================================================
      # 17. Prepare OPKG feed
      # ============================================================

      - name: Prepare OPKG feed
        run: |
          echo "========================================"
          echo "Prepare OPKG feed"
          echo "========================================"

          rm -rf ./artifact/opkg-feed


          mkdir -p \
            ./artifact/opkg-feed/packages \
            ./artifact/opkg-feed/targets/rockchip/armv8


          cp -a \
            ./bin/packages/. \
            ./artifact/opkg-feed/packages/


