#
# DoorNet2 OpenWrt + iStore
# LAN: 192.168.100.1
# Boot:
#   TF inserted -> boot kernel + rootfs from TF
#   TF removed  -> boot kernel + rootfs from eMMC
#
# Base source:
# https://github.com/DHDAXCW/lede-rockchip
#

name: DoorNet2-OpenWrt-iStore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_openwrt:

    name: Build DoorNet2 OpenWrt Firmware

    runs-on: ubuntu-22.04

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update

          sudo -E apt -y purge \
            azure-cli* \
            docker* \
            ghc* \
            zulu* \
            llvm* \
            firefox \
            google* \
            dotnet* \
            powershell* \
            openjdk* \
            mysql* \
            php* \
            mongodb* \
            snap* || true

          sudo -E apt -y full-upgrade

          sudo -E apt -y install \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout OpenWrt
        uses: actions/checkout@v4

      - name: Add iStore feed
        run: |
          echo "=============================="
          echo "Add iStore feed"
          echo "=============================="

          grep -q '^src-git istore ' feeds.conf.default || \
            echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default

          cat feeds.conf.default

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f
          ./scripts/feeds install -d y -p istore luci-app-store

      - name: Set default LAN IP
        run: |
          LAN_CONFIG="package/base-files/files/bin/config_generate"

          echo "========================================"
          echo "Set LAN IP: 192.168.100.1"
          echo "========================================"

          if [ ! -f "$LAN_CONFIG" ]; then
            echo "ERROR: Cannot find $LAN_CONFIG"
            exit 1
          fi

          if ! grep -q "192\.168\.1\.1" "$LAN_CONFIG"; then
            echo "ERROR: Default LAN IP 192.168.1.1 not found"
            exit 1
          fi

          sed -i 's/192\.168\.1\.1/192.168.100.1/g' "$LAN_CONFIG"

          if ! grep -q "192\.168\.100\.1" "$LAN_CONFIG"; then
            echo "ERROR: LAN IP modification failed"
            exit 1
          fi

          echo "LAN IP successfully changed:"
          grep -n "192\.168\.100\.1" "$LAN_CONFIG"

      - name: Configure TF card priority boot
        run: |
          echo "========================================"
          echo "DoorNet2 smart boot"
          echo "TF inserted -> TF kernel + TF rootfs"
          echo "TF removed  -> eMMC kernel + eMMC rootfs"
          echo "========================================"

          cat > target/linux/rockchip/image/doornet2.bootscript <<'EOF'
          #
          # EmbedFire DoorNet2 smart TF/eMMC boot
          #
          # U-Boot:
          #   mmc1 = TF / SD
          #   mmc0 = eMMC
          #
          # Linux on DoorNet2:
          #   mmcblk1 = TF / SD
          #   mmcblk0 = eMMC
          #

          if test "${devtype}" = "mmc"; then
              if test "${devnum}" = "1"; then
                  echo "DoorNet2: booting completely from TF card";
                  setenv rootdev "/dev/mmcblk1p2";
              elif test "${devnum}" = "0"; then
                  echo "DoorNet2: booting completely from eMMC";
                  setenv rootdev "/dev/mmcblk0p2";
              else
                  part uuid ${devtype} ${devnum}:2 uuid;
                  setenv rootdev "PARTUUID=${uuid}";
              fi;
          else
              part uuid ${devtype} ${devnum}:2 uuid;
              setenv rootdev "PARTUUID=${uuid}";
          fi;

          if test "${stdout}" = "serial@fe660000"; then
              setenv serial_addr ",0xfe660000";
          elif test "${stdout}" = "serial@feb50000"; then
              setenv serial_addr ",0xfeb50000";
          elif test "${stdout}" = "serial@ff130000"; then
              setenv serial_addr ",0xff130000";
          elif test "${stdout}" = "serial@ff1a0000"; then
              setenv serial_addr ",0xff1a0000";
          fi;

          setenv bootargs "coherent_pool=2M console=ttyS2,1500000 earlycon=uart8250,mmio32${serial_addr} root=${rootdev} rw rootwait";

          load ${devtype} ${devnum}:1 ${kernel_addr_r} kernel.img;

          bootm ${kernel_addr_r};
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("target/linux/rockchip/image/armv8.mk")
          text = path.read_text()

          start_marker = "define Device/embedfire_doornet2"
          start = text.find(start_marker)

          if start == -1:
              raise SystemExit("ERROR: DoorNet2 device definition not found")

          end = text.find("endef", start)

          if end == -1:
              raise SystemExit("ERROR: DoorNet2 device block is incomplete")

          block = text[start:end]

          if "BOOT_SCRIPT := doornet2" not in block:
              if "  BOOT_FLOW := pine64-bin\n" not in block:
                  raise SystemExit("ERROR: DoorNet2 BOOT_FLOW not found")

              block = block.replace(
                  "  BOOT_FLOW := pine64-bin\n",
                  "  BOOT_FLOW := pine64-bin\n  BOOT_SCRIPT := doornet2\n"
              )

              text = text[:start] + block + text[end:]
              path.write_text(text)

          print("DoorNet2 device block:")
          new_text = path.read_text()
          start = new_text.find(start_marker)
          end = new_text.find("endef", start)
          print(new_text[start:end + len("endef")])
          PY

          echo "========================================"
          echo "Custom boot script:"
          echo "========================================"
          cat target/linux/rockchip/image/doornet2.bootscript

          echo "========================================"
          echo "Check BOOT_SCRIPT:"
          echo "========================================"

          grep -A8 "define Device/embedfire_doornet2" \
            target/linux/rockchip/image/armv8.mk

          if ! grep -A8 "define Device/embedfire_doornet2" \
            target/linux/rockchip/image/armv8.mk | \
            grep -q "BOOT_SCRIPT := doornet2"; then
            echo "ERROR: BOOT_SCRIPT was not enabled"
            exit 1
          fi

          echo "TF/eMMC smart boot configuration OK"

      - name: Configure DoorNet2 and iStore
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y

          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_embedfire_doornet2=y

          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=512

          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-compat=y
          EOF

      - name: Generate configuration file
        run: |
          make defconfig

          echo "========================================"
          echo "DoorNet2:"
          echo "========================================"
          grep -E 'CONFIG_TARGET.*embedfire_doornet2' .config || true

          echo "========================================"
          echo "iStore:"
          echo "========================================"
          grep -E 'CONFIG_PACKAGE_luci-app-store|CONFIG_PACKAGE_luci-compat' .config || true

          echo "========================================"
          echo "LAN:"
          echo "========================================"
          grep -n "192\.168\.100\.1" \
            package/base-files/files/bin/config_generate

          echo "========================================"
          echo "Boot mode:"
          echo "========================================"
          grep -A8 "define Device/embedfire_doornet2" \
            target/linux/rockchip/image/armv8.mk

      - name: Download packages
        run: |
          make download -j16
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s

          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h

          echo "======================="
          echo "Firmware files:"
          echo "======================="
          find ./bin/targets/ -type f | sort

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          mkdir -p ./artifact/firmware

          find ./bin/targets/ -type d -name "packages" \
            -prune -exec rm -rf {} +

          find ./bin/packages/ \
            -type f \
            -name "*.ipk" \
            -exec cp -f {} ./artifact/package/ \;

          find ./bin/targets/ \
            -type f \
            \( -name "*.buildinfo" -o \
               -name "*.manifest" -o \
               -name "*.config" \) \
            -exec cp -f {} ./artifact/buildinfo/ \;

          find ./bin/targets/ \
            -type f \
            \( -name "*.img" -o \
               -name "*.img.gz" -o \
               -name "*.bin" -o \
               -name "*.itb" -o \
               -name "*.gz" \) \
            -exec cp -f {} ./artifact/firmware/ \;

          cd ./artifact/firmware

          if [ "$(find . -maxdepth 1 -type f | wc -l)" -gt 0 ]; then
            sha256sum * > sha256sums.txt
          fi

          echo "========================================"
          echo "Firmware artifact:"
          echo "========================================"
          ls -lah

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_buildinfo
          path: ./artifact/buildinfo/
          retention-days: 30

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_packages
          path: ./artifact/package/
          retention-days: 30

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_firmware
          path: ./artifact/firmware/
          retention-days: 30
