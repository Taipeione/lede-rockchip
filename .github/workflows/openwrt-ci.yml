            gh release upload \
              "${DOORNET2_TAG}" \
              "${GITHUB_WORKSPACE}/artifact/release/DoorNet2-ext4-sysupgrade.img.gz" \
              "${GITHUB_WORKSPACE}/artifact/release/sha256sums.txt" \
              "${GITHUB_WORKSPACE}/artifact/release/version.json" \
              "${GITHUB_WORKSPACE}/artifact/release/release-notes.md" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber


            gh release edit \
              "${DOORNET2_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "DoorNet2 ${DOORNET2_VERSION}" \
              --notes-file "${GITHUB_WORKSPACE}/artifact/release/release-notes.md"


          else

            gh release create \
              "${DOORNET2_TAG}" \
              "${GITHUB_WORKSPACE}/artifact/release/DoorNet2-ext4-sysupgrade.img.gz" \
              "${GITHUB_WORKSPACE}/artifact/release/sha256sums.txt" \
              "${GITHUB_WORKSPACE}/artifact/release/version.json" \
              "${GITHUB_WORKSPACE}/artifact/release/release-notes.md" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "DoorNet2 ${DOORNET2_VERSION}" \
              --notes-file "${GITHUB_WORKSPACE}/artifact/release/release-notes.md"

          fi


          echo "========================================"
          echo "Release information"
          echo "========================================"


          gh release view \
            "${DOORNET2_TAG}" \
            --repo "${GITHUB_REPOSITORY}"
