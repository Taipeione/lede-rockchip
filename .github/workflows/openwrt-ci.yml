      - name: Configure TF card priority boot
        run: |
          echo "========================================"
          echo "Configure DoorNet2 TF-first boot"
          echo "TF inserted  -> boot completely from TF"
          echo "TF removed   -> boot from eMMC"
          echo "========================================"

          #
          # 1. Create DoorNet2-specific boot script
          #
          cat > target/linux/rockchip/image/doornet2.bootscript <<'EOF'
          #
          # DoorNet2 TF/eMMC smart boot
          #
          # U-Boot mmc1 = TF/SD card
          # Linux mmcblk1 = TF/SD card
          # Linux mmcblk0 = eMMC
          #

          if test "${devtype}" = "mmc"; then
              if test "${devnum}" = "1"; then
                  echo "========================================";
                  echo "DoorNet2: TF card detected";
                  echo "Boot kernel + rootfs completely from TF";
                  echo "========================================";
                  setenv rootdev "/dev/mmcblk1p2";
              else
                  echo "========================================";
                  echo "DoorNet2: booting from eMMC";
                  echo "========================================";
                  setenv rootdev "/dev/mmcblk0p2";
              fi;
          else
              part uuid ${devtype} ${devnum}:2 uuid;
              setenv rootdev "PARTUUID=${uuid}";
          fi;

          if test "${stdout}" = "serial@fe660000"; then
              setenv serial_addr ",0xfe660000";
          elif test "${stdout}" = "serial@feb50000"; then
              setenv serial_addr ",0xfeb50000";
          elif test "${stdout}" = "serial@ff130000"; then
              setenv serial_addr ",0xff130000";
          elif test "${stdout}" = "serial@ff1a0000"; then
              setenv serial_addr ",0xff1a0000";
          fi;

          setenv bootargs "coherent_pool=2M console=ttyS2,1500000 earlycon=uart8250,mmio32${serial_addr} root=${rootdev} rw rootwait";

          load ${devtype} ${devnum}:1 ${kernel_addr_r} kernel.img;

          bootm ${kernel_addr_r};
          EOF

          #
          # 2. Tell DoorNet2 image builder to use our custom boot script
          #
          python3 <<'PY'
          from pathlib import Path

          p = Path("target/linux/rockchip/image/armv8.mk")
          s = p.read_text()

          old = """define Device/embedfire_doornet2
            DEVICE_VENDOR := EmbedFire
            DEVICE_MODEL := DoorNet2
            SOC := rk3399
            BOOT_FLOW := pine64-bin
          """

          new = """define Device/embedfire_doornet2
            DEVICE_VENDOR := EmbedFire
            DEVICE_MODEL := DoorNet2
            SOC := rk3399
            BOOT_FLOW := pine64-bin
            BOOT_SCRIPT := doornet2
          """

          if "BOOT_SCRIPT := doornet2" not in s:
              if old not in s:
                  raise SystemExit("ERROR: DoorNet2 device block not found")
              s = s.replace(old, new)

          p.write_text(s)
          PY

          #
          # 3. Make U-Boot search TF first, then all possible eMMC MMC slots
          #
          mkdir -p package/boot/uboot-rockchip/patches

          cat > package/boot/uboot-rockchip/patches/999-doornet2-tf-first.patch <<'EOF'
          --- a/include/configs/rockchip-common.h
          +++ b/include/configs/rockchip-common.h
          @@ -12,7 +12,7 @@
           #ifndef CONFIG_SPL_BUILD
           
          -#define BOOT_TARGETS	"mmc1 mmc0 nvme scsi usb pxe dhcp spi"
          +#define BOOT_TARGETS	"mmc1 mmc0 mmc2 nvme scsi usb pxe dhcp spi"
           #ifdef CONFIG_ARM64
           #define ROOT_UUID "B921B045-1DF0-41C3-AF44-4C6F280D3FAE;\0"
           #else
          EOF

          echo "========================================"
          echo "Check DoorNet2 configuration"
          echo "========================================"

          grep -A8 "define Device/embedfire_doornet2" \
            target/linux/rockchip/image/armv8.mk

          echo "========================================"
          cat target/linux/rockchip/image/doornet2.bootscript
