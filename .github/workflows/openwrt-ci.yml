name: DoorNet2-OpenWrt-iStore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build DoorNet2 OpenWrt Firmware
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Build environment
      # ============================================================

      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            2>/dev/null || true

          docker system prune -af 2>/dev/null || true

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            genisoimage \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            libc6-dev-i386 \
            libelf-dev \
            libfuse-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libpython3-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            llvm \
            lrzsz \
            msmtp \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python3 \
            python3-pyelftools \
            python3-setuptools \
            qemu-utils \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev

          sudo apt-get clean
          sudo timedatectl set-timezone "Asia/Shanghai" || true

          df -h


      # ============================================================
      # 2. Checkout
      # ============================================================

      - name: Checkout OpenWrt
        uses: actions/checkout@v4


      # ============================================================
      # 3. Version
      # ============================================================

      - name: Generate build version
        run: |
          set -e

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BUILD_DAY="$(date -u +'%Y.%m.%d')"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          VERSION="${BUILD_DAY}-r${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          TAG="doornet2-${VERSION}"

          echo "DOORNET2_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "DOORNET2_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "DOORNET2_BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"

          echo "========================================"
          echo "VERSION=${VERSION}"
          echo "TAG=${TAG}"
          echo "========================================"


      # ============================================================
      # 4. iStore
      # ============================================================

      - name: Add iStore feed
        run: |
          set -e

          grep -q '^src-git istore ' feeds.conf.default || \
            echo 'src-git istore https://github.com/linkease/istore;main' \
            >> feeds.conf.default

          cat feeds.conf.default


      - name: Update feeds
        run: |
          set -e

          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

          ./scripts/feeds install \
            -d y \
            -p istore \
            luci-app-store


      # ============================================================
      # 5. LAN
      # ============================================================

      - name: Set default LAN IP
        run: |
          set -e

          LAN_CONFIG="package/base-files/files/bin/config_generate"

          if [ ! -f "$LAN_CONFIG" ]; then
            echo "ERROR: $LAN_CONFIG not found"
            exit 1
          fi

          sed -i \
            's/192\.168\.1\.1/192.168.100.1/g' \
            "$LAN_CONFIG"

          grep -n "192\.168\.100\.1" "$LAN_CONFIG" || true


      # ============================================================
      # 6. WAN eth0 DHCP
      # ============================================================

      - name: Configure default WAN
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/96-doornet2-wan <<'EOF'
          #!/bin/sh

          uci -q set network.wan='interface'
          uci -q set network.wan.device='eth0'
          uci -q set network.wan.proto='dhcp'
          uci -q commit network

          logger -t doornet2 "Default WAN configured: eth0 DHCP"

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/96-doornet2-wan


      # ============================================================
      # 7. Disable extroot
      # ============================================================

      - name: Disable root extroot configuration
        run: |
          set -e

          mkdir -p files/etc/config

          cat > files/etc/config/fstab <<'EOF'
          config global
                  option anon_swap '0'
                  option anon_mount '0'
                  option auto_swap '1'
                  option auto_mount '1'
                  option delay_root '5'
                  option check_fs '0'
          EOF

          echo "===== SAFE FSTAB ====="
          cat files/etc/config/fstab

          if grep -Eq \
            "option[[:space:]]+target[[:space:]]+['\"]?/['\"]?" \
            files/etc/config/fstab
          then
            echo "ERROR: root extroot target detected"
            exit 1
          fi

          echo "Safe fstab verified."


      # ============================================================
      # 8. OPKG feed
      # ============================================================

      - name: Configure GitHub OPKG feed
        run: |
          set -e

          mkdir -p files/etc/opkg

          cat > files/etc/opkg/distfeeds.conf <<'EOF'
          src/gz openwrt_core https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/targets/rockchip/armv8/packages
          src/gz openwrt_base https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/base
          src/gz openwrt_istore https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/istore
          src/gz openwrt_luci https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/luci
          src/gz openwrt_packages https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/packages
          src/gz openwrt_routing https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/routing
          src/gz openwrt_telephony https://raw.githubusercontent.com/Taipeione/lede-rockchip/opkg-feed/packages/aarch64_generic/telephony
          EOF

          cat files/etc/opkg/distfeeds.conf


      # ============================================================
      # 9. Release information
      # ============================================================

      - name: Embed DoorNet2 version
        run: |
          set -e

          mkdir -p files/etc

          cat > files/etc/doornet2_release <<EOF
          DOORNET2_VERSION='${DOORNET2_VERSION}'
          DOORNET2_TAG='${DOORNET2_TAG}'
          DOORNET2_BUILD_DATE='${DOORNET2_BUILD_DATE}'
          DOORNET2_GIT_COMMIT='${GITHUB_SHA}'
          DOORNET2_GITHUB_REPOSITORY='${GITHUB_REPOSITORY}'
          DOORNET2_BOARD='embedfire,doornet2'
          DOORNET2_BOOT_MODE='tf-first-emmc-fallback'
          DOORNET2_STORAGE_FIX='no-extroot'
          DOORNET2_UPDATER='target-guard-v1'
          EOF

          cat files/etc/doornet2_release


      # ============================================================
      # 10. Proven r15 boot logic
      #
      # IMPORTANT:
      # Do not add mmc dev / mmc rescan / part uuid
      # ============================================================

      - name: Configure proven TF card priority boot
        run: |
          set -e

          cat > target/linux/rockchip/image/doornet2.bootscript <<'EOF'
          #
          # EmbedFire DoorNet2 smart boot
          #
          # Proven stable method:
          #
          # TF:
          #   load mmc 1:1 kernel.img
          #   root=/dev/mmcblk1p2
          #
          # eMMC fallback:
          #   load mmc 0:1 kernel.img
          #   root=/dev/mmcblk0p2
          #

          if test "${stdout}" = "serial@fe660000"; then
              setenv serial_addr ",0xfe660000";
          elif test "${stdout}" = "serial@feb50000"; then
              setenv serial_addr ",0xfeb50000";
          elif test "${stdout}" = "serial@ff130000"; then
              setenv serial_addr ",0xff130000";
          elif test "${stdout}" = "serial@ff1a0000"; then
              setenv serial_addr ",0xff1a0000";
          else
              setenv serial_addr "";
          fi;

          echo "========================================";
          echo "DoorNet2 smart boot";
          echo "Priority: TF -> eMMC";
          echo "========================================";

          echo "Trying TF: mmc 1:1";

          if load mmc 1:1 ${kernel_addr_r} kernel.img; then

              echo "DoorNet2: TF kernel found";
              echo "DoorNet2: boot completely from TF";

              setenv rootdev "/dev/mmcblk1p2";

              setenv bootargs "coherent_pool=2M console=ttyS2,1500000 earlycon=uart8250,mmio32${serial_addr} root=${rootdev} rw rootwait";

              echo "DoorNet2 root=${rootdev}";

              bootm ${kernel_addr_r};

              echo "WARNING: TF bootm returned unexpectedly";
              echo "Falling back to eMMC";

          else

              echo "DoorNet2: TF kernel not found";
              echo "DoorNet2: fallback to eMMC";

          fi;

          echo "========================================";
          echo "Fallback to eMMC: mmc 0:1";
          echo "========================================";

          if load mmc 0:1 ${kernel_addr_r} kernel.img; then

              echo "DoorNet2: eMMC kernel found";
              echo "DoorNet2: boot completely from eMMC";

              setenv rootdev "/dev/mmcblk0p2";

              setenv bootargs "coherent_pool=2M console=ttyS2,1500000 earlycon=uart8250,mmio32${serial_addr} root=${rootdev} rw rootwait";

              echo "DoorNet2 root=${rootdev}";

              bootm ${kernel_addr_r};

          else

              echo "FATAL: eMMC kernel.img not found";

          fi;

          echo "========================================";
          echo "FATAL: No bootable DoorNet2 system";
          echo "========================================";
          EOF


          python3 <<'PY'
          from pathlib import Path

          path = Path("target/linux/rockchip/image/armv8.mk")

          if not path.exists():
              raise SystemExit("ERROR: armv8.mk not found")

          text = path.read_text()

          marker = "define Device/embedfire_doornet2"

          start = text.find(marker)

          if start == -1:
              raise SystemExit(
                  "ERROR: DoorNet2 device definition not found"
              )

          end = text.find("endef", start)

          if end == -1:
              raise SystemExit(
                  "ERROR: DoorNet2 device definition incomplete"
              )

          block = text[start:end]

          if "BOOT_SCRIPT := doornet2" not in block:

              if "BOOT_FLOW := pine64-bin" not in block:
                  raise SystemExit(
                      "ERROR: DoorNet2 BOOT_FLOW not found"
                  )

              block = block.replace(
                  "  BOOT_FLOW := pine64-bin\n",
                  "  BOOT_FLOW := pine64-bin\n"
                  "  BOOT_SCRIPT := doornet2\n"
              )

              text = text[:start] + block + text[end:]

              path.write_text(text)

          text = path.read_text()

          start = text.find(marker)
          end = text.find("endef", start)

          print(text[start:end + len("endef")])
          PY


          echo "===== BOOT SCRIPT ====="
          cat target/linux/rockchip/image/doornet2.bootscript


          echo "===== VERIFY ====="

          if grep -Eq \
            '^[[:space:]]*(mmc dev|mmc rescan|part uuid)' \
            target/linux/rockchip/image/doornet2.bootscript
          then
              echo "ERROR: unsupported U-Boot commands found"
              exit 1
          fi

          echo "Stable boot script verified."


      # ============================================================
      # 11. taskd compatibility
      # ============================================================

      - name: Add taskd compatibility fix
        run: |
          set -e

          mkdir -p files/etc/uci-defaults

          cat > files/etc/uci-defaults/99-taskd-compat <<'EOF'
          #!/bin/sh

          TASKS="/etc/init.d/tasks"

          if [ -f "$TASKS" ] && \
             grep -q 'extra_command ' "$TASKS" && \
             ! grep -q 'TASKD_EXTRA_COMMAND_COMPAT' "$TASKS"
          then

              TMP="/tmp/tasks.compat.$$"

              awk '
              NR == 1 {
                  print
                  print ""
                  print "# TASKD_EXTRA_COMMAND_COMPAT"
                  print "type extra_command >/dev/null 2>&1 || extra_command() { :; }"
                  next
              }
              {
                  print
              }
              ' "$TASKS" > "$TMP"

              cat "$TMP" > "$TASKS"
              rm -f "$TMP"

              chmod 755 "$TASKS"

              logger -t taskd \
                "Applied extra_command compatibility fix"
          fi

          exit 0
          EOF

          chmod 755 files/etc/uci-defaults/99-taskd-compat


      # ============================================================
      # 12. DoorNet2 updater
      # ============================================================

      - name: Add DoorNet2 online updater
        run: |
          set -e

          mkdir -p \
            files/usr/bin \
            files/usr/lib/lua/luci/controller \
            files/usr/lib/lua/luci/view/doornet2


          cat > files/usr/bin/doornet2-updater <<'EOF'
          #!/bin/sh

          # LuCI/rpcd may run with a restricted PATH.
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin

          REPO="Taipeione/lede-rockchip"

          BASE_URL="https://github.com/${REPO}/releases/latest/download"

          WORKDIR="/tmp/doornet2-update"

          META="${WORKDIR}/version.json"

          FIRMWARE="${WORKDIR}/DoorNet2-ext4-sysupgrade.img.gz"

          TESTLOG="/tmp/doornet2-sysupgrade-test.log"

          UPGRADELOG="/tmp/doornet2-upgrade.log"

          RELEASE_INFO="/etc/doornet2_release"

          EXPECTED_BOARD="embedfire,doornet2"

          EXPECTED_ASSET="DoorNet2-ext4-sysupgrade.img.gz"


          get_current_version()
          {
              CURRENT_VERSION="unknown"
              CURRENT_TAG="unknown"

              if [ -f "$RELEASE_INFO" ]; then

                  . "$RELEASE_INFO"

                  CURRENT_VERSION="${DOORNET2_VERSION:-unknown}"
                  CURRENT_TAG="${DOORNET2_TAG:-unknown}"

              fi
          }


          # ---------------------------------------------------------
          # Authoritative boot media detection
          #
          # r15+ has extroot disabled.
          # Therefore root= from U-Boot is authoritative.
          # ---------------------------------------------------------

          get_root_info()
          {
              ROOT_DEVICE=""
              CMDLINE=""

              if [ -r /proc/cmdline ]; then

                  IFS= read -r CMDLINE < /proc/cmdline

                  for ARG in $CMDLINE; do

                      case "$ARG" in

                          root=/dev/mmcblk0p2|root=/dev/mmcblk1p2)

                              ROOT_DEVICE="${ARG#root=}"
                              break
                              ;;

                      esac

                  done

              fi


              # Fallback only if cmdline did not provide expected root.
              if [ -z "$ROOT_DEVICE" ]; then

                  ROOT_DEVICE="$(
                      /bin/mount 2>/dev/null |
                      awk '
                          $3 == "/" {
                              print $1
                              exit
                          }
                      '
                  )"

              fi


              case "$ROOT_DEVICE" in

                  /dev/mmcblk0p2)

                      UPGRADE_DISK="/dev/mmcblk0"
                      BOOT_MEDIA="eMMC"
                      ;;

                  /dev/mmcblk1p2)

                      UPGRADE_DISK="/dev/mmcblk1"
                      BOOT_MEDIA="TF"
                      ;;

                  *)

                      UPGRADE_DISK="unknown"
                      BOOT_MEDIA="unknown"
                      ;;

              esac
          }


          get_board()
          {
              BOARD="unknown"

              if [ -r /tmp/sysinfo/board_name ]; then

                  IFS= read -r BOARD < /tmp/sysinfo/board_name

                  [ -n "$BOARD" ] || BOARD="unknown"

              fi
          }


          # ---------------------------------------------------------
          # Safety guard
          #
          # Verify OpenWrt's OWN sysupgrade target agrees with
          # DoorNet2 current boot media.
          #
          # TF:
          #   expected /dev/mmcblk1
          #   OpenWrt diskdev must be mmcblk1
          #
          # eMMC:
          #   expected /dev/mmcblk0
          #   OpenWrt diskdev must be mmcblk0
          #
          # Any mismatch = refuse upgrade.
          # ---------------------------------------------------------

          verify_sysupgrade_target()
          {
              SYSUPGRADE_DISK="unknown"
              TARGET_GUARD_MESSAGE="unknown"

              get_root_info


              case "$UPGRADE_DISK" in

                  /dev/mmcblk0)
                      EXPECTED_DISKDEV="mmcblk0"
                      ;;

                  /dev/mmcblk1)
                      EXPECTED_DISKDEV="mmcblk1"
                      ;;

                  *)
                      TARGET_GUARD_MESSAGE="unsupported_root_device"
                      return 10
                      ;;

              esac


              if [ ! -r /lib/functions.sh ]; then
                  TARGET_GUARD_MESSAGE="functions_missing"
                  return 11
              fi


              if [ ! -r /lib/upgrade/common.sh ]; then
                  TARGET_GUARD_MESSAGE="upgrade_common_missing"
                  return 12
              fi


              . /lib/functions.sh
              . /lib/upgrade/common.sh


              unset diskdev


              if ! export_bootdevice >/dev/null 2>&1; then

                  TARGET_GUARD_MESSAGE="export_bootdevice_failed"
                  return 13

              fi


              if ! export_partdevice diskdev 0 >/dev/null 2>&1; then

                  TARGET_GUARD_MESSAGE="export_partdevice_failed"
                  return 14

              fi


              SYSUPGRADE_DISK="/dev/${diskdev}"


              if [ "$diskdev" != "$EXPECTED_DISKDEV" ]; then

                  TARGET_GUARD_MESSAGE="target_mismatch"
                  return 15

              fi


              TARGET_GUARD_MESSAGE="ok"

              return 0
          }


          fetch_metadata()
          {
              mkdir -p "$WORKDIR"

              rm -f "${META}.part"

              if ! curl \
                  -LfsS \
                  --connect-timeout 15 \
                  --retry 3 \
                  -o "${META}.part" \
                  "${BASE_URL}/version.json"
              then
                  return 1
              fi

              mv "${META}.part" "$META"


              LATEST_VERSION="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.version' \
                    2>/dev/null
              )"


              LATEST_TAG="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.tag' \
                    2>/dev/null
              )"


              LATEST_BOARD="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.board' \
                    2>/dev/null
              )"


              LATEST_ASSET="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.asset' \
                    2>/dev/null
              )"


              LATEST_SHA="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.sha256' \
                    2>/dev/null
              )"


              [ "$LATEST_BOARD" = "$EXPECTED_BOARD" ] || return 2

              [ "$LATEST_ASSET" = "$EXPECTED_ASSET" ] || return 3

              [ -n "$LATEST_VERSION" ] || return 4

              echo "$LATEST_SHA" | \
                  grep -Eq '^[0-9a-fA-F]{64}$' || \
                  return 5

              return 0
          }


          command_status()
          {
              get_current_version
              get_root_info
              get_board

              printf '{'
              printf '"ok":true,'
              printf '"current_version":"%s",' "$CURRENT_VERSION"
              printf '"current_tag":"%s",' "$CURRENT_TAG"
              printf '"board":"%s",' "$BOARD"
              printf '"root_device":"%s",' "$ROOT_DEVICE"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"boot_media":"%s"' "$BOOT_MEDIA"
              printf '}\n'
          }


          command_check()
          {
              get_current_version
              get_root_info
              get_board

              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1
              fi


              case "$UPGRADE_DISK" in

                  /dev/mmcblk0|/dev/mmcblk1)
                      ;;

                  *)

                      printf \
                        '{"ok":false,"message":"unsupported_root_device"}\n'

                      exit 1
                      ;;

              esac


              if ! fetch_metadata; then

                  printf \
                    '{"ok":false,"message":"metadata_download_failed"}\n'

                  exit 1
              fi


              if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then

                  AVAILABLE="false"

              else

                  AVAILABLE="true"

              fi


              printf '{'
              printf '"ok":true,'
              printf '"current_version":"%s",' "$CURRENT_VERSION"
              printf '"latest_version":"%s",' "$LATEST_VERSION"
              printf '"latest_tag":"%s",' "$LATEST_TAG"
              printf '"update_available":%s,' "$AVAILABLE"
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"upgrade_disk":"%s"' "$UPGRADE_DISK"
              printf '}\n'
          }


          command_prepare()
          {
              get_current_version
              get_root_info
              get_board


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1
              fi


              case "$ROOT_DEVICE" in

                  /dev/mmcblk0p2|/dev/mmcblk1p2)
                      ;;

                  *)

                      printf \
                        '{"ok":false,"message":"unsupported_root_device"}\n'

                      exit 1
                      ;;

              esac


              # Verify target BEFORE downloading.
              if ! verify_sysupgrade_target; then

                  printf '{'
                  printf '"ok":false,'
                  printf '"message":"target_guard_failed",'
                  printf '"guard_message":"%s",' "$TARGET_GUARD_MESSAGE"
                  printf '"boot_media":"%s",' "$BOOT_MEDIA"
                  printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
                  printf '"sysupgrade_disk":"%s"' "$SYSUPGRADE_DISK"
                  printf '}\n'

                  exit 1
              fi


              if ! fetch_metadata; then

                  printf \
                    '{"ok":false,"message":"metadata_download_failed"}\n'

                  exit 1
              fi


              rm -f "${FIRMWARE}.part"


              if ! curl \
                  -LfsS \
                  --connect-timeout 15 \
                  --retry 3 \
                  -o "${FIRMWARE}.part" \
                  "${BASE_URL}/${EXPECTED_ASSET}"
              then

                  rm -f "${FIRMWARE}.part"

                  printf \
                    '{"ok":false,"message":"firmware_download_failed"}\n'

                  exit 1
              fi


              mv "${FIRMWARE}.part" "$FIRMWARE"


              ACTUAL_SHA="$(
                  sha256sum "$FIRMWARE" |
                  awk '{print $1}'
              )"


              if [ "$ACTUAL_SHA" != "$LATEST_SHA" ]; then

                  rm -f "$FIRMWARE"

                  printf \
                    '{"ok":false,"message":"sha256_failed"}\n'

                  exit 1
              fi


              rm -f "$TESTLOG"


              if ! /sbin/sysupgrade \
                  -T \
                  "$FIRMWARE" \
                  >"$TESTLOG" 2>&1
              then

                  printf \
                    '{"ok":false,"message":"sysupgrade_test_failed"}\n'

                  exit 1
              fi


              # Verify target again after sysupgrade -T.
              if ! verify_sysupgrade_target; then

                  printf '{'
                  printf '"ok":false,'
                  printf '"message":"target_guard_failed_after_test",'
                  printf '"guard_message":"%s",' "$TARGET_GUARD_MESSAGE"
                  printf '"boot_media":"%s",' "$BOOT_MEDIA"
                  printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
                  printf '"sysupgrade_disk":"%s"' "$SYSUPGRADE_DISK"
                  printf '}\n'

                  exit 1
              fi


              SIZE="$(
                  du -h "$FIRMWARE" |
                  awk '{print $1}'
              )"


              printf '{'
              printf '"ok":true,'
              printf '"ready":true,'
              printf '"current_version":"%s",' "$CURRENT_VERSION"
              printf '"latest_version":"%s",' "$LATEST_VERSION"
              printf '"sha256":"%s",' "$ACTUAL_SHA"
              printf '"size":"%s",' "$SIZE"
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"sysupgrade_disk":"%s",' "$SYSUPGRADE_DISK"
              printf '"target_guard":"ok"'
              printf '}\n'
          }


          command_upgrade()
          {
              get_root_info
              get_board


              if [ "$BOARD" != "$EXPECTED_BOARD" ]; then

                  printf \
                    '{"ok":false,"message":"board_mismatch"}\n'

                  exit 1
              fi


              case "$ROOT_DEVICE" in

                  /dev/mmcblk0p2|/dev/mmcblk1p2)
                      ;;

                  *)

                      printf \
                        '{"ok":false,"message":"unsupported_root_device"}\n'

                      exit 1
                      ;;

              esac


              if [ ! -f "$META" ] || \
                 [ ! -f "$FIRMWARE" ]; then

                  printf \
                    '{"ok":false,"message":"firmware_not_prepared"}\n'

                  exit 1
              fi


              LATEST_SHA="$(
                  jsonfilter \
                    -i "$META" \
                    -e '@.sha256' \
                    2>/dev/null
              )"


              ACTUAL_SHA="$(
                  sha256sum "$FIRMWARE" |
                  awk '{print $1}'
              )"


              if [ -z "$LATEST_SHA" ] || \
                 [ "$LATEST_SHA" != "$ACTUAL_SHA" ]; then

                  printf \
                    '{"ok":false,"message":"sha256_failed"}\n'

                  exit 1
              fi


              if ! /sbin/sysupgrade \
                  -T \
                  "$FIRMWARE" \
                  >"$TESTLOG" 2>&1
              then

                  printf \
                    '{"ok":false,"message":"sysupgrade_test_failed"}\n'

                  exit 1
              fi


              # FINAL TARGET GUARD.
              # This is executed immediately before real sysupgrade.
              if ! verify_sysupgrade_target; then

                  printf '{'
                  printf '"ok":false,'
                  printf '"message":"final_target_guard_failed",'
                  printf '"guard_message":"%s",' "$TARGET_GUARD_MESSAGE"
                  printf '"boot_media":"%s",' "$BOOT_MEDIA"
                  printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
                  printf '"sysupgrade_disk":"%s"' "$SYSUPGRADE_DISK"
                  printf '}\n'

                  exit 1
              fi


              sync


              (
                  sleep 3

                  /sbin/sysupgrade \
                    -v \
                    "$FIRMWARE"

              ) >"$UPGRADELOG" \
                2>&1 \
                </dev/null &


              printf '{'
              printf '"ok":true,'
              printf '"started":true,'
              printf '"boot_media":"%s",' "$BOOT_MEDIA"
              printf '"upgrade_disk":"%s",' "$UPGRADE_DISK"
              printf '"sysupgrade_disk":"%s",' "$SYSUPGRADE_DISK"
              printf '"target_guard":"ok"'
              printf '}\n'
          }


          case "$1" in

              status)
                  command_status
                  ;;

              check)
                  command_check
                  ;;

              prepare)
                  command_prepare
                  ;;

              upgrade)
                  command_upgrade
                  ;;

              *)
                  echo "Usage:"
                  echo "  doornet2-updater status"
                  echo "  doornet2-updater check"
                  echo "  doornet2-updater prepare"
                  echo "  doornet2-updater upgrade"
                  exit 1
                  ;;

          esac
          EOF

          chmod 755 files/usr/bin/doornet2-updater

          sh -n files/usr/bin/doornet2-updater


          # ----------------------------------------------------------
          # LuCI controller
          # ----------------------------------------------------------

          cat > files/usr/lib/lua/luci/controller/doornet2_update.lua <<'EOF'
          module("luci.controller.doornet2_update", package.seeall)

          function index()

              if not nixio.fs.access("/usr/bin/doornet2-updater") then
                  return
              end

              local page = entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update"
                  },
                  template("doornet2/update"),
                  _("DoorNet2 在线升级"),
                  90
              )

              page.dependent = false

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "status"
                  },
                  call("action_status")
              ).leaf = true

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "check"
                  },
                  call("action_check")
              ).leaf = true

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "prepare"
                  },
                  call("action_prepare")
              ).leaf = true

              entry(
                  {
                      "admin",
                      "system",
                      "doornet2_update",
                      "upgrade"
                  },
                  call("action_upgrade")
              ).leaf = true
          end


          local function output_json(command)

              local http = require "luci.http"
              local sys = require "luci.sys"

              local result = sys.exec(
                  "/usr/bin/doornet2-updater " ..
                  command ..
                  " 2>/dev/null"
              )

              http.prepare_content("application/json")
              http.write(result)
          end


          local function require_post()

              local http = require "luci.http"

              if http.getenv("REQUEST_METHOD") ~= "POST" then

                  http.status(
                      405,
                      "Method Not Allowed"
                  )

                  http.prepare_content(
                      "application/json"
                  )

                  http.write(
                      '{"ok":false,"message":"POST required"}'
                  )

                  return false
              end

              return true
          end


          function action_status()
              output_json("status")
          end


          function action_check()
              output_json("check")
          end


          function action_prepare()

              if not require_post() then
                  return
              end

              output_json("prepare")
          end


          function action_upgrade()

              if not require_post() then
                  return
              end

              output_json("upgrade")
          end
          EOF


          # ----------------------------------------------------------
          # LuCI page
          # ----------------------------------------------------------

          cat > files/usr/lib/lua/luci/view/doornet2/update.htm <<'EOF'
          <%+header%>

          <h2><%:DoorNet2 在线升级%></h2>

          <div class="cbi-map">

              <div class="cbi-section">

                  <h3><%:固件信息%></h3>

                  <table class="table">

                      <tr class="tr">
                          <td class="td">
                              <strong>当前版本</strong>
                          </td>
                          <td class="td" id="current_version">
                              正在读取...
                          </td>
                      </tr>

                      <tr class="tr">
                          <td class="td">
                              <strong>最新版本</strong>
                          </td>
                          <td class="td" id="latest_version">
                              尚未检查
                          </td>
                      </tr>

                      <tr class="tr">
                          <td class="td">
                              <strong>当前启动介质</strong>
                          </td>
                          <td class="td" id="boot_media">
                              -
                          </td>
                      </tr>

                      <tr class="tr">
                          <td class="td">
                              <strong>升级目标磁盘</strong>
                          </td>
                          <td class="td" id="upgrade_disk">
                              -
                          </td>
                      </tr>

                  </table>

              </div>


              <div class="cbi-section">

                  <h3><%:在线升级%></h3>

                  <p>
                      检查 GitHub 最新版本 →
                      下载固件 →
                      SHA256 校验 →
                      sysupgrade 兼容性检查 →
                      升级目标保险校验 →
                      正式升级。
                  </p>

                  <p>
                      TF 启动时只升级 TF；
                      eMMC 启动时只升级 eMMC。
                  </p>

                  <p>
                      如果 DoorNet2 判断的目标磁盘与
                      OpenWrt sysupgrade 判断结果不一致，
                      系统会拒绝执行正式升级。
                  </p>

                  <div style="margin-top:20px">

                      <input
                          type="button"
                          class="btn cbi-button cbi-button-action"
                          id="btn_check"
                          value="检查更新"
                          onclick="checkUpdate()"
                      />

                      &nbsp;

                      <input
                          type="button"
                          class="btn cbi-button cbi-button-apply"
                          id="btn_prepare"
                          value="下载并校验"
                          onclick="prepareUpdate()"
                          disabled="disabled"
                      />

                      &nbsp;

                      <input
                          type="button"
                          class="btn cbi-button cbi-button-negative"
                          id="btn_upgrade"
                          value="立即升级"
                          onclick="startUpgrade()"
                          disabled="disabled"
                      />

                  </div>

                  <div
                      id="status_box"
                      style="
                          margin-top:20px;
                          padding:15px;
                          border:1px solid #ccc;
                          border-radius:4px;
                          min-height:24px;
                      "
                  >
                      正在读取设备信息...
                  </div>

              </div>

          </div>


          <script type="text/javascript">

          var URL_STATUS =
              '<%=luci.dispatcher.build_url(
                  "admin",
                  "system",
                  "doornet2_update",
                  "status"
              )%>';

          var URL_CHECK =
              '<%=luci.dispatcher.build_url(
                  "admin",
                  "system",
                  "doornet2_update",
                  "check"
              )%>';

          var URL_PREPARE =
              '<%=luci.dispatcher.build_url(
                  "admin",
                  "system",
                  "doornet2_update",
                  "prepare"
              )%>';

          var URL_UPGRADE =
              '<%=luci.dispatcher.build_url(
                  "admin",
                  "system",
                  "doornet2_update",
                  "upgrade"
              )%>';


          function setStatus(text)
          {
              document.getElementById(
                  "status_box"
              ).innerHTML = text;
          }


          function setBusy(busy)
          {
              document.getElementById(
                  "btn_check"
              ).disabled = busy;

              if (busy)
              {
                  document.getElementById(
                      "btn_prepare"
                  ).disabled = true;

                  document.getElementById(
                      "btn_upgrade"
                  ).disabled = true;
              }
          }


          function request(url, method, callback)
          {
              var xhr = new XMLHttpRequest();

              xhr.open(
                  method,
                  url,
                  true
              );

              if (method == "POST")
              {
                  xhr.setRequestHeader(
                      "Content-Type",
                      "application/x-www-form-urlencoded"
                  );
              }

              xhr.onreadystatechange =
                  function()
                  {
                      if (xhr.readyState != 4)
                      {
                          return;
                      }

                      var data;

                      try
                      {
                          data =
                              JSON.parse(
                                  xhr.responseText
                              );
                      }
                      catch (e)
                      {
                          callback(
                              {
                                  ok: false,
                                  message:
                                      "返回数据解析失败"
                              }
                          );

                          return;
                      }

                      callback(data);
                  };

              xhr.send(
                  method == "POST"
                      ? "confirm=1"
                      : null
              );
          }


          function loadStatus()
          {
              request(
                  URL_STATUS,
                  "GET",

                  function(data)
                  {
                      if (!data.ok)
                      {
                          setStatus(
                              "无法读取设备状态。"
                          );

                          return;
                      }

                      document.getElementById(
                          "current_version"
                      ).innerHTML =
                          data.current_version;

                      document.getElementById(
                          "boot_media"
                      ).innerHTML =
                          data.boot_media;

                      document.getElementById(
                          "upgrade_disk"
                      ).innerHTML =
                          data.upgrade_disk;

                      setStatus(
                          "设备状态正常。"
                      );
                  }
              );
          }


          function checkUpdate()
          {
              setBusy(true);

              setStatus(
                  "正在连接 GitHub 检查最新版本..."
              );

              request(
                  URL_CHECK,
                  "GET",

                  function(data)
                  {
                      setBusy(false);

                      if (!data.ok)
                      {
                          setStatus(
                              "检查更新失败：" +
                              (
                                  data.message ||
                                  "未知错误"
                              )
                          );

                          return;
                      }

                      document.getElementById(
                          "current_version"
                      ).innerHTML =
                          data.current_version;

                      document.getElementById(
                          "latest_version"
                      ).innerHTML =
                          data.latest_version;

                      document.getElementById(
                          "boot_media"
                      ).innerHTML =
                          data.boot_media;

                      document.getElementById(
                          "upgrade_disk"
                      ).innerHTML =
                          data.upgrade_disk;

                      if (data.update_available)
                      {
                          setStatus(
                              "<strong>发现新版本。</strong>"
                              + "<br />"
                              + "可以点击“下载并校验”。"
                          );

                          document.getElementById(
                              "btn_prepare"
                          ).disabled = false;
                      }
                      else
                      {
                          setStatus(
                              "<strong>当前已经是最新版本。</strong>"
                          );
                      }
                  }
              );
          }


          function prepareUpdate()
          {
              if (
                  !confirm(
                      "开始下载最新版固件并进行校验？"
                  )
              )
              {
                  return;
              }

              setBusy(true);

              setStatus(
                  "正在下载固件并执行 SHA256、sysupgrade 和目标磁盘保险校验..."
              );

              request(
                  URL_PREPARE,
                  "POST",

                  function(data)
                  {
                      setBusy(false);

                      if (!data.ok)
                      {
                          setStatus(
                              "<strong>准备升级失败：</strong> "
                              + (
                                  data.message ||
                                  "未知错误"
                              )
                              + (
                                  data.guard_message
                                  ? "<br />保险锁：" + data.guard_message
                                  : ""
                              )
                              + (
                                  data.sysupgrade_disk
                                  ? "<br />sysupgrade 判断：" + data.sysupgrade_disk
                                  : ""
                              )
                          );

                          return;
                      }

                      document.getElementById(
                          "latest_version"
                      ).innerHTML =
                          data.latest_version;

                      document.getElementById(
                          "boot_media"
                      ).innerHTML =
                          data.boot_media;

                      document.getElementById(
                          "upgrade_disk"
                      ).innerHTML =
                          data.upgrade_disk;

                      setStatus(
                          "<strong>固件准备完成。</strong>"
                          + "<br />"
                          + "SHA256：通过"
                          + "<br />"
                          + "sysupgrade：通过"
                          + "<br />"
                          + "目标磁盘保险锁：通过"
                          + "<br />"
                          + "DoorNet2 目标：" +
                          data.upgrade_disk
                          + "<br />"
                          + "sysupgrade 目标：" +
                          data.sysupgrade_disk
                          + "<br />"
                          + "大小：" +
                          data.size
                      );

                      document.getElementById(
                          "btn_upgrade"
                      ).disabled = false;
                  }
              );
          }


          function startUpgrade()
          {
              var disk =
                  document.getElementById(
                      "upgrade_disk"
                  ).innerHTML;

              if (
                  !confirm(
                      "即将升级 " +
                      disk +
                      "。\n\n"
                      + "正式升级前系统会再次核对目标磁盘。\n"
                      + "如果目标不一致会自动拒绝升级。\n\n"
                      + "升级过程中绝对不要断电。\n\n"
                      + "确定继续？"
                  )
              )
              {
                  return;
              }

              setBusy(true);

              setStatus(
                  "<strong>正在执行最终保险校验并启动升级。</strong>"
              );

              request(
                  URL_UPGRADE,
                  "POST",

                  function(data)
                  {
                      if (!data.ok)
                      {
                          setBusy(false);

                          setStatus(
                              "<strong>升级启动失败：</strong> "
                              + (
                                  data.message ||
                                  "未知错误"
                              )
                              + (
                                  data.guard_message
                                  ? "<br />保险锁：" + data.guard_message
                                  : ""
                              )
                              + (
                                  data.sysupgrade_disk
                                  ? "<br />sysupgrade 判断：" + data.sysupgrade_disk
                                  : ""
                              )
                          );

                          return;
                      }

                      setStatus(
                          "<strong>升级已经开始。</strong>"
                          + "<br />"
                          + "DoorNet2 目标：" +
                          data.upgrade_disk
                          + "<br />"
                          + "sysupgrade 目标：" +
                          data.sysupgrade_disk
                          + "<br />"
                          + "目标磁盘保险锁：通过"
                          + "<br /><br />"
                          + "设备即将断开并自动重启。"
                      );
                  }
              );
          }


          window.onload = loadStatus;

          </script>

          <%+footer%>
          EOF


      # ============================================================
      # 13. Packages
      # ============================================================

      - name: Configure DoorNet2 and packages
        run: |
          set -e

          cat >> .config <<'EOF'

          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_MULTI_PROFILE=y

          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_embedfire_doornet2=y

          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=7168

          CONFIG_TARGET_ROOTFS_TARGZ=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y

          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-compat=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          CONFIG_PACKAGE_jsonfilter=y

          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_sfdisk=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_blockdev=y
          CONFIG_PACKAGE_partx-utils=y
          CONFIG_PACKAGE_mount-utils=y

          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_resize2fs=y
          CONFIG_PACKAGE_tune2fs=y

          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y

          EOF


      # ============================================================
      # 14. Generate config
      # ============================================================

      - name: Generate configuration file
        run: |
          set -e

          make defconfig

          echo "===== TARGET ====="

          grep -E \
            'CONFIG_TARGET.*embedfire_doornet2' \
            .config || true

          echo
          echo "===== ROOTFS ====="

          grep \
            'CONFIG_TARGET_ROOTFS_PARTSIZE' \
            .config || true

          echo
          echo "===== FSTAB ====="

          cat files/etc/config/fstab

          echo
          echo "===== UPDATER HEADER ====="

          head -20 files/usr/bin/doornet2-updater

          echo
          echo "===== UPDATER SAFETY ====="

          grep -nE \
            'export PATH|get_root_info|verify_sysupgrade_target|target_guard' \
            files/usr/bin/doornet2-updater

          echo
          echo "===== UPDATER FILES ====="

          ls -lah \
            files/usr/bin/doornet2-updater \
            files/usr/lib/lua/luci/controller/doornet2_update.lua \
            files/usr/lib/lua/luci/view/doornet2/update.htm


      # ============================================================
      # 15. Download
      # ============================================================

      - name: Download packages
        run: |
          make download -j16

          find dl \
            -size -1024c \
            -exec rm -f {} \;


      # ============================================================
      # 16. Compile
      # ============================================================

      - name: Compile firmware
        run: |
          make -j$(nproc) || \
            make -j1 V=s

          df -h

          find ./bin/targets/ \
            -type f \
            | sort


      # ============================================================
      # 17. Prepare artifacts
      # ============================================================

      - name: Prepare artifact
        run: |
          set -e

          mkdir -p \
            ./artifact/package \
            ./artifact/buildinfo \
            ./artifact/firmware \
            ./artifact/release


          find ./bin/packages/ \
            -type f \
            -name "*.ipk" \
            -exec cp -f {} ./artifact/package/ \;


          find ./bin/targets/ \
            -type f \
            \( \
              -name "*.buildinfo" \
              -o -name "*.manifest" \
              -o -name "*.config" \
            \) \
            -exec cp -f {} ./artifact/buildinfo/ \;


          find ./bin/targets/ \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.bin" \
              -o -name "*.itb" \
              -o -name "*.gz" \
            \) \
            ! -path "*/packages/*" \
            -exec cp -f {} ./artifact/firmware/ \;


          SOURCE_FW="$(
            find ./bin/targets/rockchip/armv8 \
              -maxdepth 1 \
              -type f \
              -name '*embedfire_doornet2-ext4-sysupgrade.img.gz' \
              | head -n 1
          )"


          if [ -z "$SOURCE_FW" ]; then
              echo "ERROR: DoorNet2 firmware not found"
              exit 1
          fi


          cp -f \
            "$SOURCE_FW" \
            ./artifact/release/DoorNet2-ext4-sysupgrade.img.gz


          cd ./artifact/release


          SHA256="$(
            sha256sum \
              DoorNet2-ext4-sysupgrade.img.gz \
              | awk '{print $1}'
          )"


          echo \
            "${SHA256}  DoorNet2-ext4-sysupgrade.img.gz" \
            > sha256sums.txt


          cat > version.json <<EOF
          {
            "board": "embedfire,doornet2",
            "version": "${DOORNET2_VERSION}",
            "tag": "${DOORNET2_TAG}",
            "build_date": "${DOORNET2_BUILD_DATE}",
            "commit": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}",
            "asset": "DoorNet2-ext4-sysupgrade.img.gz",
            "sha256": "${SHA256}",
            "boot_policy": "proven-tf-first-emmc-fallback",
            "extroot": false,
            "updater": "target-guard-v1"
          }
          EOF


          cat > release-notes.md <<EOF
          # DoorNet2 OpenWrt ${DOORNET2_VERSION}

          Build information:

          - Board: EmbedFire DoorNet2
          - Target: rockchip/armv8
          - Version: ${DOORNET2_VERSION}
          - Git commit: ${GITHUB_SHA}
          - GitHub Actions run: ${GITHUB_RUN_NUMBER}
          - Build date: ${DOORNET2_BUILD_DATE}

          Main configuration:

          - LAN: 192.168.100.1
          - WAN: eth0 DHCP
          - RootFS: 7GB ext4
          - TF priority boot
          - eMMC automatic fallback
          - extroot disabled
          - iStore included
          - GitHub OPKG feed
          - LuCI online updater

          Online updater safety:

          - Fixed PATH for LuCI/rpcd
          - Boot media read from /proc/cmdline
          - TF root /dev/mmcblk1p2 -> target /dev/mmcblk1
          - eMMC root /dev/mmcblk0p2 -> target /dev/mmcblk0
          - OpenWrt sysupgrade diskdev is checked before upgrade
          - Upgrade is refused if DoorNet2 target and sysupgrade target differ

          Firmware:

          DoorNet2-ext4-sysupgrade.img.gz

          SHA256:

          ${SHA256}
          EOF


          ls -lah
          cat version.json


      # ============================================================
      # 18. OPKG feed
      # ============================================================

      - name: Prepare OPKG feed
        run: |
          set -e

          rm -rf ./artifact/opkg-feed

          mkdir -p \
            ./artifact/opkg-feed/packages \
            ./artifact/opkg-feed/targets/rockchip/armv8

          cp -a \
            ./bin/packages/. \
            ./artifact/opkg-feed/packages/


          if [ -d "./bin/targets/rockchip/armv8/packages" ]; then

            cp -a \
              ./bin/targets/rockchip/armv8/packages \
              ./artifact/opkg-feed/targets/rockchip/armv8/

          else

            echo "ERROR: target packages directory not found"
            exit 1

          fi


          cat > ./artifact/opkg-feed/README.md <<EOF
          # DoorNet2 OPKG Feed

          Repository:
          ${GITHUB_REPOSITORY}

          Firmware:
          ${DOORNET2_VERSION}

          Target:
          rockchip/armv8

          Architecture:
          aarch64_generic

          Commit:
          ${GITHUB_SHA}
          EOF


          PACKAGE_INDEX_COUNT="$(
            find ./artifact/opkg-feed \
              -type f \
              -name "Packages.gz" \
              | wc -l
          )"

          echo "Packages.gz count: ${PACKAGE_INDEX_COUNT}"

          if [ "$PACKAGE_INDEX_COUNT" -lt 2 ]; then
            echo "ERROR: package indexes missing"
            exit 1
          fi

          du -sh ./artifact/opkg-feed


      # ============================================================
      # 19. Upload artifacts
      # ============================================================

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_buildinfo
          path: ./artifact/buildinfo/
          retention-days: 30


      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_packages
          path: ./artifact/package/
          retention-days: 30


      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_firmware
          path: ./artifact/firmware/
          retention-days: 30


      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_release
          path: ./artifact/release/
          retention-days: 30


      - name: Upload OPKG feed backup
        uses: actions/upload-artifact@v4
        with:
          name: DoorNet2_opkg_feed
          path: ./artifact/opkg-feed/
          retention-days: 30


      # ============================================================
      # 20. Publish OPKG
      # ============================================================

      - name: Publish OPKG feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf /tmp/doornet2-opkg-feed

          git clone \
            --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/doornet2-opkg-feed

          cd /tmp/doornet2-opkg-feed

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout \
            --orphan \
            opkg-feed-new

          git rm -rf . \
            >/dev/null 2>&1 || true

          cp -a \
            "${GITHUB_WORKSPACE}/artifact/opkg-feed/." \
            .

          git add -A

          git commit \
            -m "Update DoorNet2 OPKG feed ${DOORNET2_VERSION}"

          git branch -M opkg-feed

          git push \
            --force \
            origin \
            opkg-feed


      # ============================================================
      # 21. GitHub Release
      # ============================================================

      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "Tag: ${DOORNET2_TAG}"

          if gh release view \
            "${DOORNET2_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            >/dev/null 2>&1
          then

            gh release upload \
              "${DOORNET2_TAG}" \
              "${GITHUB_WORKSPACE}/artifact/release/DoorNet2-ext4-sysupgrade.img.gz" \
              "${GITHUB_WORKSPACE}/artifact/release/sha256sums.txt" \
              "${GITHUB_WORKSPACE}/artifact/release/version.json" \
              "${GITHUB_WORKSPACE}/artifact/release/release-notes.md" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber

            gh release edit \
              "${DOORNET2_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "DoorNet2 ${DOORNET2_VERSION}" \
              --notes-file \
              "${GITHUB_WORKSPACE}/artifact/release/release-notes.md"

          else

            gh release create \
              "${DOORNET2_TAG}" \
              "${GITHUB_WORKSPACE}/artifact/release/DoorNet2-ext4-sysupgrade.img.gz" \
              "${GITHUB_WORKSPACE}/artifact/release/sha256sums.txt" \
              "${GITHUB_WORKSPACE}/artifact/release/version.json" \
              "${GITHUB_WORKSPACE}/artifact/release/release-notes.md" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "DoorNet2 ${DOORNET2_VERSION}" \
              --notes-file \
              "${GITHUB_WORKSPACE}/artifact/release/release-notes.md"

          fi


          gh release view \
            "${DOORNET2_TAG}" \
            --repo "${GITHUB_REPOSITORY}"


      # ============================================================
      # 22. Final verification
      # ============================================================

      - name: Final build verification
        run: |
          set -e

          echo "========================================"
          echo "DoorNet2 build finished"
          echo "========================================"

          echo
          echo "VERSION:"
          echo "${DOORNET2_VERSION}"

          echo
          echo "SAFE FSTAB:"
          cat files/etc/config/fstab

          if grep -Eq \
            "option[[:space:]]+target[[:space:]]+['\"]?/['\"]?" \
            files/etc/config/fstab
          then
              echo "ERROR: extroot target found"
              exit 1
          fi

          echo
          echo "BOOT SCRIPT:"

          grep -E \
            'Trying TF|Fallback|rootdev|mmcblk' \
            target/linux/rockchip/image/doornet2.bootscript


          if grep -Eq \
            '^[[:space:]]*(mmc dev|mmc rescan|part uuid)' \
            target/linux/rockchip/image/doornet2.bootscript
          then

              echo "ERROR: bad boot commands found"
              exit 1

          fi


          echo
          echo "UPDATER PATH:"

          grep \
            'export PATH=/usr/sbin:/usr/bin:/sbin:/bin' \
            files/usr/bin/doornet2-updater


          echo
          echo "UPDATER ROOT DETECTION:"

          grep -n \
            'root=/dev/mmcblk0p2|root=/dev/mmcblk1p2' \
            files/usr/bin/doornet2-updater


          echo
          echo "UPDATER TARGET GUARD:"

          grep -n \
            'verify_sysupgrade_target' \
            files/usr/bin/doornet2-updater


          echo
          echo "SHELL SYNTAX:"

          sh -n files/usr/bin/doornet2-updater

          echo "Updater syntax OK."


          echo
          echo "RELEASE FILES:"

          ls -lah ./artifact/release/


          echo
          echo "SUCCESS"
