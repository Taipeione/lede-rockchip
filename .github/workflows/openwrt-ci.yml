      # ============================================================
      # 19. Publish OPKG feed branch
      # ============================================================

      - name: Publish OPKG feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "========================================"
          echo "Publish OPKG feed"
          echo "========================================"


          rm -rf /tmp/doornet2-opkg-feed


          git clone \
            --depth 1 \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/doornet2-opkg-feed


          cd /tmp/doornet2-opkg-feed


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git checkout \
            --orphan \
            opkg-feed-new


          git rm -rf . \
            >/dev/null 2>&1 || true


          cp -a \
            "${GITHUB_WORKSPACE}/artifact/opkg-feed/." \
            .


          git add -A


          git commit \
            -m "Update DoorNet2 OPKG feed ${DOORNET2_VERSION}"


          git branch -M \
            opkg-feed


          git push \
            --force \
            origin \
            opkg-feed


          echo "========================================"
          echo "OPKG feed published successfully"
